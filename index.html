<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AKSHAYA - Her Era Starts Here</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #240814 0%, #0b0206 100%);
      color: #fce7f3;
      overflow-x: hidden;
      min-height: 100vh;
      touch-action: manipulation;
    }

    .serif-title { font-family: 'Cinzel', serif; }

    #flipbook-wrapper {
      perspective: 2500px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 70vh;
    }

    .st-page-flip {
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.95), 0 0 50px rgba(225, 29, 72, 0.25);
      border-radius: 4px;
      margin: 0 auto;
    }

    .page-item {
      background-color: #11050a;
      position: relative;
      overflow: hidden;
    }

    .page-item canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      display: block;
    }

    /* Page Spine & Shadow Depth */
    .page-item[data-density="hard"] {
      background-color: #0d0307;
    }

    .page-item:not([data-density="hard"]):nth-child(even)::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 40px;
      background: linear-gradient(to left, rgba(0,0,0,0.22), transparent);
      pointer-events: none;
    }

    .page-item:not([data-density="hard"]):nth-child(odd)::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 40px;
      background: linear-gradient(to right, rgba(0,0,0,0.22), transparent);
      pointer-events: none;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-2 md:p-6 select-none">

  <!-- Header -->
  <header class="w-full max-w-5xl flex items-center justify-between py-2 border-b border-rose-900/40">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-gradient-to-tr from-rose-700 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-950">
        <i data-lucide="sparkles" class="w-4 h-4 md:w-5 md:h-5 text-white"></i>
      </div>
      <div>
        <h1 class="serif-title text-base md:text-xl font-bold tracking-widest text-rose-100">AKSHAYA</h1>
        <p class="text-[10px] md:text-xs text-rose-300/70 tracking-wide uppercase">22nd Birthday Edition</p>
      </div>
    </div>
    <div class="text-[11px] md:text-xs text-rose-300/80 bg-rose-950/60 px-3 py-1 rounded-full border border-rose-800/40 font-medium">
      August 23rd, 2026
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="w-full flex flex-col items-center justify-center flex-grow my-2">
    
    <!-- Loading Screen -->
    <div id="loading-state" class="flex flex-col items-center space-y-4 my-16">
      <div class="relative w-16 h-16">
        <div class="absolute inset-0 rounded-full border-4 border-rose-900/40"></div>
        <div class="absolute inset-0 rounded-full border-4 border-rose-500 border-t-transparent animate-spin"></div>
      </div>
      <p id="loading-text" class="text-sm text-rose-300 font-medium">Loading Akshaya's Magazine...</p>
      <div class="w-64 h-2 bg-rose-950 rounded-full overflow-hidden border border-rose-800/40">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-amber-500 to-rose-500 transition-all duration-200" style="width: 10%"></div>
      </div>
    </div>

    <!-- Flipbook Wrapper -->
    <div id="flipbook-wrapper" class="hidden">
      <div id="book"></div>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <footer id="control-bar" class="hidden w-full max-w-2xl bg-neutral-900/85 backdrop-blur-xl border border-rose-900/50 rounded-2xl px-4 py-2.5 shadow-2xl flex items-center justify-between gap-3">
    <!-- Prev / Next Controls -->
    <div class="flex items-center space-x-2">
      <button id="btn-prev" class="p-2.5 rounded-xl bg-rose-950/70 hover:bg-rose-800 text-rose-200 hover:text-white transition active:scale-95">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <button id="btn-next" class="p-2.5 rounded-xl bg-rose-950/70 hover:bg-rose-800 text-rose-200 hover:text-white transition active:scale-95">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
      <span class="text-xs font-semibold text-rose-200 ml-1">
        <span id="current-spread">Cover</span>
      </span>
    </div>

    <!-- Page Slider Jumper -->
    <div class="flex items-center space-x-2 flex-grow max-w-xs">
      <input id="page-slider" type="range" min="0" max="31" value="0" class="w-full accent-rose-500 cursor-pointer h-1.5 bg-rose-950 rounded-lg">
    </div>

    <!-- Audio & Fullscreen -->
    <div class="flex items-center space-x-1.5">
      <button id="btn-sound" title="Toggle Sound" class="p-2.5 rounded-xl bg-rose-950/70 hover:bg-rose-800 text-rose-200 hover:text-white transition active:scale-95">
        <i data-lucide="volume-2" class="w-4 h-4" id="sound-icon"></i>
      </button>
      <button id="btn-fullscreen" title="Fullscreen" class="p-2.5 rounded-xl bg-rose-950/70 hover:bg-rose-800 text-rose-200 hover:text-white transition active:scale-95">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>
  </footer>

  <script>
    const PDF_URL = './magazine.pdf';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlipInstance = null;
    let pdfDoc = null;
    let soundEnabled = true;

    function playTurnSound() {
      if (!soundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.08;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1200;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {
        console.warn(e);
      }
    }

    const loadingState = document.getElementById('loading-state');
    const loadingText = document.getElementById('loading-text');
    const progressBar = document.getElementById('progress-bar');
    const flipbookWrapper = document.getElementById('flipbook-wrapper');
    const bookContainer = document.getElementById('book');
    const controlBar = document.getElementById('control-bar');
    const currentSpreadEl = document.getElementById('current-spread');
    const pageSlider = document.getElementById('page-slider');

    async function loadMagazine() {
      try {
        loadingText.innerText = 'Downloading magazine...';
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        const numPages = pdfDoc.numPages;
        pageSlider.max = numPages - 1;

        for (let pageNum = 1; pageNum <= numPages; pageNum++) {
          loadingText.innerText = `Rendering page ${pageNum} of ${numPages}...`;
          progressBar.style.width = `${Math.round((pageNum / numPages) * 85) + 10}%`;

          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.6 });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-item';
          
          // Set hard cover for 1st and last page
          if (pageNum === 1 || pageNum === numPages) {
            pageDiv.setAttribute('data-density', 'hard');
          }

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;

          pageDiv.appendChild(canvas);
          bookContainer.appendChild(pageDiv);
        }

        loadingText.innerText = 'Preparing 3D Spreads...';
        progressBar.style.width = '100%';

        setTimeout(() => {
          initBookSpreads(numPages);
        }, 200);

      } catch (err) {
        console.error(err);
        loadingText.innerText = 'Error loading magazine.pdf. Ensure magazine.pdf is uploaded directly in GitHub.';
      }
    }

    function updateLabel(index, total) {
      if (index === 0) {
        currentSpreadEl.innerText = 'Front Cover';
      } else if (index >= total - 1) {
        currentSpreadEl.innerText = 'Back Cover';
      } else {
        const left = index;
        const right = index + 1;
        currentSpreadEl.innerText = `Pages ${left} - ${right}`;
      }
      pageSlider.value = index;
    }

    function initBookSpreads(totalPages) {
      loadingState.classList.add('hidden');
      flipbookWrapper.classList.remove('hidden');
      controlBar.classList.remove('hidden');

      // Calculate true editorial aspect ratio
      const availableWidth = Math.min(window.innerWidth - 20, 1100);
      const isMobile = window.innerWidth < 768;
      
      const singlePageWidth = isMobile ? Math.floor(availableWidth * 0.48) : 480;
      const singlePageHeight = Math.floor(singlePageWidth * 1.414);

      pageFlipInstance = new St.PageFlip(bookContainer, {
        width: singlePageWidth,
        height: singlePageHeight,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 580,
        minHeight: 400,
        maxHeight: 820,
        maxShadowOpacity: 0.7,
        showCover: true,          // Single front cover and single back cover
        usePortrait: false,        // Always force double-page spread mode
        flippingTime: 750,
        mobileScrollSupport: false
      });

      pageFlipInstance.loadFromHTML(document.querySelectorAll('.page-item'));

      pageFlipInstance.on('flip', (e) => {
        playTurnSound();
        updateLabel(e.data, totalPages);
      });

      document.getElementById('btn-prev').onclick = () => pageFlipInstance.flipPrev();
      document.getElementById('btn-next').onclick = () => pageFlipInstance.flipNext();

      pageSlider.oninput = (e) => {
        const target = parseInt(e.target.value);
        pageFlipInstance.flip(target);
      };

      document.getElementById('btn-sound').onclick = () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-icon').setAttribute(
          'data-lucide',
          soundEnabled ? 'volume-2' : 'volume-x'
        );
        lucide.createIcons();
      };

      document.getElementById('btn-fullscreen').onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      };

      updateLabel(0, totalPages);
      lucide.createIcons();
    }

    window.onload = loadMagazine;
    lucide.createIcons();
  </script>
</body>
</html>
