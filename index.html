<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 30%, #5b6480 0%, #3a415a 65%, #2a3044 100%);
      color: #ffffff;
      touch-action: pan-y pinch-zoom;
    }

    /* 3D Viewport Scene */
    #stage-container {
      perspective: 2600px;
      perspective-origin: 50% 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex-grow: 1;
      position: relative;
      overflow: hidden;
    }

    /* 3D Master Book Rig - All outer shadows removed */
    #book-rig {
      position: relative;
      display: flex;
      transform-style: preserve-3d;
      border-radius: 4px 18px 18px 4px;
      z-index: 10;
    }

    .page-wing {
      position: relative;
      background-color: #1a0812;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .page-wing img, .turning-sheet img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }

    /* Left page rounded outer corners */
    #left-wing {
      border-radius: 18px 0 0 18px;
    }
    #left-wing::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; right: 0;
      width: 24px;
      background: linear-gradient(to left, rgba(0,0,0,0.2) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Right page rounded outer corners */
    #right-wing {
      border-radius: 0 18px 18px 0;
    }
    #right-wing::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 24px;
      background: linear-gradient(to right, rgba(0,0,0,0.2) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Golden Tape Ribbon on the Cover */
    .golden-tape::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 22px;
      background: linear-gradient(to right, #d99b16 0%, #f5b938 60%, #c98a0e 100%);
      z-index: 30;
      pointer-events: none;
      border-radius: 4px 0 0 4px;
    }

    /* 3D Turning Leaf */
    .turning-sheet {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      z-index: 40;
      backface-visibility: hidden;
      transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .turning-sheet.turn-forward {
      right: 0;
      transform-origin: left center;
      border-radius: 0 18px 18px 0;
    }

    .turning-sheet.turn-backward {
      left: 0;
      transform-origin: right center;
      border-radius: 18px 0 0 18px;
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .face.front {
      z-index: 2;
    }

    .face.back {
      transform: rotateY(180deg);
      z-index: 1;
    }

    /* UI Pill and Buttons */
    .paper-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(45, 52, 73, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }
    .paper-icon-btn:active {
      transform: scale(0.92);
      background: rgba(70, 80, 110, 0.95);
    }

    .paper-pill-btn {
      padding: 10px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.95);
      color: #212638;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .paper-pill-btn:active {
      transform: scale(0.92);
      background: #e2e8f0;
    }
  </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen px-4 pt-3 pb-6">

  <!-- Top App Header -->
  <header class="w-full flex items-center justify-between z-20 shrink-0 px-1 pt-1">
    <div class="flex items-center space-x-2">
      <button class="paper-icon-btn" title="Refresh" onclick="location.reload()">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="flex flex-col items-center">
      <h1 class="text-base font-bold tracking-wide text-white">Journal</h1>
      <div class="flex items-center space-x-1 text-xs text-slate-300 font-medium">
        <i data-lucide="edit-3" class="w-3 h-3 text-slate-300"></i>
        <span id="page-badge">32 Pages</span>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button id="btn-sound" class="paper-icon-btn" title="Sound">
        <i data-lucide="volume-2" class="w-4 h-4" id="sound-icon"></i>
      </button>
      <button id="btn-fullscreen" class="paper-icon-btn" title="Fullscreen">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- 3D Stage (Shadows removed) -->
  <main id="stage-container">
    <div id="loading-state" class="flex flex-col items-center space-y-3 z-30">
      <div class="relative w-12 h-12">
        <div class="absolute inset-0 rounded-full border-3 border-slate-600/40"></div>
        <div class="absolute inset-0 rounded-full border-3 border-amber-400 border-t-transparent animate-spin"></div>
      </div>
      <p id="loading-text" class="text-xs text-slate-200 font-medium tracking-wide">Opening Journal...</p>
    </div>

    <div id="book-rig" class="hidden">
      <div id="left-wing" class="page-wing"></div>
      <div id="right-wing" class="page-wing"></div>
    </div>
  </main>

  <!-- Bottom Floating Pill Controls -->
  <footer class="w-full flex items-center justify-center z-20 shrink-0">
    <div class="flex items-center space-x-3 bg-[#242b3e]/85 backdrop-blur-2xl p-1.5 px-3 rounded-full border border-white/10">
      <button id="btn-prev" class="paper-pill-btn" title="Previous">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>

      <div class="px-3 text-xs font-semibold text-slate-200 tracking-wider min-w-[70px] text-center">
        <span id="spread-title">Cover</span>
      </div>

      <button id="btn-next" class="paper-pill-btn" title="Next">
        <i data-lucide="arrow-right" class="w-5 h-5"></i>
      </button>
    </div>
  </footer>

  <script>
    const PDF_URL = './magazine.pdf';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let totalPages = 32;
    let currentSpread = 0;
    let pageImages = {};
    let isAnimating = false;
    let soundEnabled = true;

    function playPaperSound() {
      if (!soundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.08;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1300;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.24, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {
        console.warn(e);
      }
    }

    const loadingState = document.getElementById('loading-state');
    const loadingText = document.getElementById('loading-text');
    const bookRig = document.getElementById('book-rig');
    const leftWing = document.getElementById('left-wing');
    const rightWing = document.getElementById('right-wing');
    const spreadTitleEl = document.getElementById('spread-title');
    const pageBadgeEl = document.getElementById('page-badge');

    let singleWidth = 200;
    let singleHeight = 280;

    async function loadMagazine() {
      try {
        loadingText.innerText = 'Downloading journal...';
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        totalPages = pdfDoc.numPages;
        pageBadgeEl.innerText = `${totalPages} Pages`;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          loadingText.innerText = `Rendering page ${pageNum} of ${totalPages}...`;
          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.6 });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;
          pageImages[pageNum] = canvas.toDataURL('image/jpeg', 0.88);
        }

        loadingState.classList.add('hidden');
        bookRig.classList.remove('hidden');

        calcLayout();
        showSpread(0);

      } catch (err) {
        console.error(err);
        loadingText.innerText = 'Please ensure magazine.pdf is present in your GitHub repo.';
      }
    }

    function calcLayout() {
      const availableW = window.innerWidth - 24;
      const availableH = window.innerHeight - 170;

      singleWidth = Math.floor(availableW / 2);
      singleHeight = Math.floor(singleWidth * 1.414);

      if (singleHeight > availableH) {
        singleHeight = Math.floor(availableH);
        singleWidth = Math.floor(singleHeight / 1.414);
      }

      singleWidth = Math.max(140, Math.min(singleWidth, 460));
      singleHeight = Math.floor(singleWidth * 1.414);

      bookRig.style.width = `${singleWidth * 2}px`;
      bookRig.style.height = `${singleHeight}px`;

      leftWing.style.width = `${singleWidth}px`;
      leftWing.style.height = `${singleHeight}px`;
      rightWing.style.width = `${singleWidth}px`;
      rightWing.style.height = `${singleHeight}px`;
    }

    function showSpread(spreadIdx) {
      currentSpread = spreadIdx;
      leftWing.innerHTML = '';
      rightWing.innerHTML = '';
      leftWing.className = 'page-wing';
      rightWing.className = 'page-wing';

      if (spreadIdx === 0) {
        leftWing.style.visibility = 'hidden';
        rightWing.style.visibility = 'visible';
        rightWing.classList.add('golden-tape');

        if (pageImages[1]) {
          rightWing.innerHTML = `<img src="${pageImages[1]}" />`;
        }
        spreadTitleEl.innerText = 'Cover';
      } else {
        const leftP = spreadIdx * 2;
        const rightP = leftP + 1;

        if (leftP >= totalPages) {
          leftWing.style.visibility = 'visible';
          rightWing.style.visibility = 'hidden';
          if (pageImages[totalPages]) {
            leftWing.innerHTML = `<img src="${pageImages[totalPages]}" />`;
          }
          spreadTitleEl.innerText = 'Back';
        } else {
          leftWing.style.visibility = 'visible';
          rightWing.style.visibility = 'visible';

          if (pageImages[leftP]) {
            leftWing.innerHTML = `<img src="${pageImages[leftP]}" />`;
          }
          if (pageImages[rightP]) {
            rightWing.innerHTML = `<img src="${pageImages[rightP]}" />`;
          }
          spreadTitleEl.innerText = `${leftP} - ${rightP}`;
        }
      }
    }

    function flipForward() {
      if (isAnimating) return;
      const totalSpreads = Math.ceil(totalPages / 2);
      if (currentSpread >= totalSpreads) return;

      isAnimating = true;
      playPaperSound();

      const nextSpread = currentSpread + 1;
      const currentRightPage = currentSpread === 0 ? 1 : (currentSpread * 2 + 1);
      const nextLeftPage = nextSpread * 2;

      const sheet = document.createElement('div');
      sheet.className = 'turning-sheet turn-forward';
      sheet.innerHTML = `
        <div class="face front">
          <img src="${pageImages[currentRightPage]}" />
        </div>
        <div class="face back">
          <img src="${pageImages[nextLeftPage] || pageImages[totalPages]}" />
        </div>
      `;

      bookRig.appendChild(sheet);

      const nextRightP = nextSpread * 2 + 1;
      if (nextRightP <= totalPages && pageImages[nextRightP]) {
        rightWing.innerHTML = `<img src="${pageImages[nextRightP]}" />`;
        rightWing.classList.remove('golden-tape');
      } else {
        rightWing.style.visibility = 'hidden';
      }

      requestAnimationFrame(() => {
        sheet.style.transform = 'rotateY(-180deg)';
      });

      setTimeout(() => {
        sheet.remove();
        showSpread(nextSpread);
        isAnimating = false;
      }, 650);
    }

    function flipBackward() {
      if (isAnimating) return;
      if (currentSpread <= 0) return;

      isAnimating = true;
      playPaperSound();

      const prevSpread = currentSpread - 1;
      const currentLeftPage = currentSpread * 2;
      const prevRightPage = prevSpread === 0 ? 1 : (prevSpread * 2 + 1);

      const sheet = document.createElement('div');
      sheet.className = 'turning-sheet turn-backward';
      sheet.style.transform = 'rotateY(180deg)';
      sheet.innerHTML = `
        <div class="face front">
          <img src="${pageImages[prevRightPage]}" />
        </div>
        <div class="face back">
          <img src="${pageImages[currentLeftPage]}" />
        </div>
      `;

      bookRig.appendChild(sheet);

      const prevLeftP = prevSpread * 2;
      if (prevSpread > 0 && pageImages[prevLeftP]) {
        leftWing.innerHTML = `<img src="${pageImages[prevLeftP]}" />`;
      } else {
        leftWing.style.visibility = 'hidden';
      }

      requestAnimationFrame(() => {
        sheet.style.transform = 'rotateY(0deg)';
      });

      setTimeout(() => {
        sheet.remove();
        showSpread(prevSpread);
        isAnimating = false;
      }, 650);
    }

    document.getElementById('btn-next').onclick = flipForward;
    document.getElementById('btn-prev').onclick = flipBackward;

    let touchStartX = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    window.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 45) {
        flipForward();
      } else if (touchEndX - touchStartX > 45) {
        flipBackward();
      }
    }, false);

    window.addEventListener('resize', () => {
      calcLayout();
    });

    document.getElementById('btn-sound').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-icon').setAttribute(
        'data-lucide',
        soundEnabled ? 'volume-2' : 'volume-x'
      );
      lucide.createIcons();
    };

    document.getElementById('btn-fullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    window.onload = loadMagazine;
    lucide.createIcons();
  </script>
</body>
</html>
