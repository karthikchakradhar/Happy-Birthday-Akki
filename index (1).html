<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshaya - Her Era Starts Here</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #220813 0%, #0c0206 100%);
      color: #fce7f3;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .serif-title { font-family: 'Cinzel', serif; }

    #flipbook-wrapper { perspective: 2500px; }

    .st-page-flip {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 45px rgba(225, 29, 72, 0.2);
      border-radius: 6px;
    }

    .page-item {
      background-color: #fff;
      position: relative;
      overflow: hidden;
    }

    .page-item canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      display: block;
    }

    .page-item::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35px;
      pointer-events: none;
    }

    .page-item:nth-child(odd)::after {
      left: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.18), transparent);
    }

    .page-item:nth-child(even)::after {
      right: 0;
      background: linear-gradient(to left, rgba(0,0,0,0.18), transparent);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-3 md:p-6">

  <!-- Header -->
  <header class="w-full max-w-5xl flex items-center justify-between py-2 border-b border-rose-900/40">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-700 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-950">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="serif-title text-lg md:text-xl font-bold tracking-widest text-rose-100">AKSHAYA</h1>
        <p class="text-[11px] text-rose-300/70 tracking-wide uppercase">Her Era Starts Here &bull; 22nd Edition</p>
      </div>
    </div>
    <div class="text-xs text-rose-400/80 bg-rose-950/60 px-3 py-1.5 rounded-full border border-rose-800/40">
      August 23rd, 2026
    </div>
  </header>

  <!-- Main Flipbook Area -->
  <main class="w-full flex flex-col items-center justify-center flex-grow my-4">
    
    <!-- Loading Screen -->
    <div id="loading-state" class="flex flex-col items-center space-y-4 my-12">
      <div class="relative w-16 h-16">
        <div class="absolute inset-0 rounded-full border-4 border-rose-900/40"></div>
        <div class="absolute inset-0 rounded-full border-4 border-rose-500 border-t-transparent animate-spin"></div>
      </div>
      <p id="loading-text" class="text-sm text-rose-300 font-medium">Opening Akshaya's Magazine...</p>
      <div class="w-64 h-2 bg-rose-950 rounded-full overflow-hidden border border-rose-800/40">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-amber-500 to-rose-500 transition-all duration-200" style="width: 10%"></div>
      </div>
    </div>

    <!-- Flipbook Container -->
    <div id="flipbook-wrapper" class="hidden flex flex-col items-center justify-center w-full max-w-6xl">
      <div id="book" class="mx-auto my-2"></div>
    </div>

  </main>

  <!-- Control Bar -->
  <footer id="control-bar" class="hidden w-full max-w-2xl bg-neutral-900/80 backdrop-blur-xl border border-rose-900/50 rounded-2xl px-5 py-2.5 shadow-2xl flex items-center justify-between gap-3">
    <!-- Prev / Next Controls -->
    <div class="flex items-center space-x-2">
      <button id="btn-prev" class="p-2.5 rounded-xl bg-rose-950/60 hover:bg-rose-800 text-rose-200 hover:text-white transition active:scale-95">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <button id="btn-next" class="p-2.5 rounded-xl bg-rose-950/60 hover:bg-rose-800 text-rose-200 hover:text-white transition active:scale-95">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
      <span class="text-xs font-semibold text-rose-300 ml-2">
        <span id="current-page">1</span> / <span id="total-pages">32</span>
      </span>
    </div>

    <!-- Page Stepper / Slider -->
    <div class="flex items-center space-x-3 flex-grow max-w-xs">
      <input id="page-slider" type="range" min="1" max="32" value="1" class="w-full accent-rose-500 cursor-pointer h-1.5 bg-rose-950 rounded-lg">
    </div>

    <!-- Sound & Fullscreen -->
    <div class="flex items-center space-x-2">
      <button id="btn-sound" title="Toggle Sound" class="p-2.5 rounded-xl bg-rose-950/60 hover:bg-rose-800 text-rose-200 hover:text-white transition active:scale-95">
        <i data-lucide="volume-2" class="w-4 h-4" id="sound-icon"></i>
      </button>
      <button id="btn-fullscreen" title="Fullscreen" class="p-2.5 rounded-xl bg-rose-950/60 hover:bg-rose-800 text-rose-200 hover:text-white transition active:scale-95">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>
  </footer>

  <script>
    // PDF Configuration - Automatically loads the magazine file directly from GitHub
    const PDF_URL = './magazine.pdf';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlipInstance = null;
    let pdfDoc = null;
    let soundEnabled = true;

    function playTurnSound() {
      if (!soundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.08;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1200;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch (e) {
        console.warn(e);
      }
    }

    const loadingState = document.getElementById('loading-state');
    const loadingText = document.getElementById('loading-text');
    const progressBar = document.getElementById('progress-bar');
    const flipbookWrapper = document.getElementById('flipbook-wrapper');
    const bookContainer = document.getElementById('book');
    const controlBar = document.getElementById('control-bar');
    const currentPageEl = document.getElementById('current-page');
    const totalPagesEl = document.getElementById('total-pages');
    const pageSlider = document.getElementById('page-slider');

    async function loadMagazine() {
      try {
        loadingText.innerText = 'Downloading magazine...';
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        const numPages = pdfDoc.numPages;
        totalPagesEl.innerText = numPages;
        pageSlider.max = numPages;

        for (let pageNum = 1; pageNum <= numPages; pageNum++) {
          loadingText.innerText = `Rendering page ${pageNum} of ${numPages}...`;
          progressBar.style.width = `${Math.round((pageNum / numPages) * 80) + 10}%`;

          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-item shadow-inner';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;

          pageDiv.appendChild(canvas);
          bookContainer.appendChild(pageDiv);
        }

        loadingText.innerText = 'Opening flipbook...';
        progressBar.style.width = '100%';

        setTimeout(() => {
          initFlipBook();
        }, 300);

      } catch (err) {
        console.error(err);
        loadingText.innerText = 'Error loading magazine.pdf. Ensure magazine.pdf is in the repository.';
      }
    }

    function initFlipBook() {
      loadingState.classList.add('hidden');
      flipbookWrapper.classList.remove('hidden');
      controlBar.classList.remove('hidden');

      const isMobile = window.innerWidth < 768;
      const pageWidth = isMobile ? Math.min(window.innerWidth - 30, 420) : 460;
      const pageHeight = isMobile ? pageWidth * 1.414 : 650;

      pageFlipInstance = new St.PageFlip(bookContainer, {
        width: pageWidth,
        height: pageHeight,
        size: 'stretch',
        minWidth: 320,
        maxWidth: 550,
        minHeight: 450,
        maxHeight: 780,
        drawShadow: true,
        flippingTime: 700,
        usePortrait: isMobile,
        startZIndex: 0,
        autoSize: true,
        showCover: true
      });

      pageFlipInstance.loadFromHTML(document.querySelectorAll('.page-item'));

      pageFlipInstance.on('flip', (e) => {
        playTurnSound();
        const current = e.data + 1;
        currentPageEl.innerText = current;
        pageSlider.value = current;
      });

      document.getElementById('btn-prev').onclick = () => pageFlipInstance.flipPrev();
      document.getElementById('btn-next').onclick = () => pageFlipInstance.flipNext();

      pageSlider.oninput = (e) => {
        const targetPage = parseInt(e.target.value) - 1;
        pageFlipInstance.flip(targetPage);
      };

      document.getElementById('btn-sound').onclick = () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-icon').setAttribute(
          'data-lucide',
          soundEnabled ? 'volume-2' : 'volume-x'
        );
        lucide.createIcons();
      };

      document.getElementById('btn-fullscreen').onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      };

      lucide.createIcons();
    }

    window.onload = loadMagazine;
    lucide.createIcons();
  </script>
</body>
</html>
